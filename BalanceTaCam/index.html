<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balance Ta Cam</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12232e">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#e8f0f2;color:#12232e;min-height:100vh}
.hidden{display:none!important}

header{background:#12232e;color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:22px}
header .actions{display:flex;gap:10px;flex-wrap:wrap}

button{border:none;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:#f2b705;color:#12232e}
button.secondary{background:#20303c;color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}

main{max-width:1000px;margin:0 auto;padding:20px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 6px 18px rgba(0,0,0,.08);margin-bottom:18px}
h2{margin-bottom:10px}
p.muted{color:#5b6b76}

#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(180deg,#e8f0f2,#d7e5ea)}
.auth-box{background:#fff;border-radius:20px;padding:28px;width:100%;max-width:420px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.title-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px}
.camera-logo{width:80px;height:66px}
.auth-box h2{text-align:center;margin-bottom:6px}
.auth-box .sub{text-align:center;color:#5b6b76;margin-bottom:18px}

label{display:block;font-weight:700;margin:12px 0 6px}
input,select,textarea{width:100%;padding:12px;border:2px solid #d7e5ea;border-radius:10px;font-size:16px}
textarea{min-height:90px;resize:vertical}
.btn-full{width:100%;margin-top:16px;padding:14px;font-size:16px}
.auth-switch{text-align:center;margin-top:14px;font-size:14px}
.auth-switch a{color:#0b6bcb;cursor:pointer;text-decoration:underline}

#map{height:420px;border-radius:14px;overflow:hidden;border:2px solid #d7e5ea}
.map-tools{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.form-grid{grid-template-columns:1fr}}
.form-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filters button.active{background:#12232e;color:#fff}

.report{border:2px solid #e6eef1;border-radius:14px;padding:14px;margin-bottom:12px}
.report-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;background:#fff4d6;color:#8a6100}
.badge.ok{background:#e6f6ea;color:#1c7c3c}
.report h3{margin:6px 0 4px}
.report p{margin:4px 0}
.report .meta{font-size:13px;color:#5b6b76}
.report-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.report-actions button{padding:8px 10px;font-size:13px}

#status{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:#12232e;color:#fff;padding:12px 18px;border-radius:12px;display:none;z-index:9999}
#status.show{display:block}
</style>
</head>
<body>

<section id="auth">
  <div class="auth-box">
    <div class="title-row">
      <h2>Balance Ta Cam</h2>
      <svg class="camera-logo" viewBox="0 0 100 88" aria-hidden="true">
        <path d="M34 26 Q40 20 46 26" stroke="#12232e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <path d="M28 18 Q40 6 52 18" stroke="#12232e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <path d="M22 10 Q40 -8 58 10" stroke="#12232e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <rect x="10" y="34" width="56" height="30" rx="10" fill="#f2b705" stroke="#12232e" stroke-width="3"/>
        <path d="M66 40 L88 30 L88 68 L66 58 Z" fill="#f2b705" stroke="#12232e" stroke-width="3"/>
        <circle cx="31" cy="49" r="9" fill="#fff" stroke="#12232e" stroke-width="2.5"/>
        <circle cx="28" cy="50" r="3.5" fill="#12232e"/>
        <circle cx="53" cy="49" r="9" fill="#fff" stroke="#12232e" stroke-width="2.5"/>
        <circle cx="56" cy="50" r="3.5" fill="#12232e"/>
      </svg>
    </div>

    <p class="sub">Signale les caméras de surveillance autour de toi.</p>

    <div id="login-form">
      <label for="login-email">Email</label>
      <input id="login-email" type="email" placeholder="ton@email.com">
      <label for="login-password">Mot de passe</label>
      <input id="login-password" type="password" placeholder="Ton mot de passe">
      <button class="btn-full" id="btn-login">Se connecter</button>
      <p class="auth-switch">Pas encore de compte ? <a id="show-register">Créer un compte</a></p>
    </div>

    <div id="register-form" class="hidden">
      <label for="register-pseudo">Pseudo</label>
      <input id="register-pseudo" type="text" placeholder="Ton pseudo">
      <label for="register-email">Email</label>
      <input id="register-email" type="email" placeholder="ton@email.com">
      <label for="register-password">Mot de passe</label>
      <input id="register-password" type="password" placeholder="Choisis un mot de passe">
      <button class="btn-full" id="btn-register">Créer mon compte</button>
      <p class="auth-switch">Tu as déjà un compte ? <a id="show-login">Se connecter</a></p>
    </div>
  </div>
</section>

<div id="app" class="hidden">
  <header>
    <div class="brand">
      <span>🎥</span>
      <h1>Balance Ta Cam</h1>
    </div>
    <div class="actions">
      <button id="btn-my-area">Ma zone</button>
      <button id="btn-logout" class="secondary">Déconnexion</button>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>Carte des caméras</h2>
      <p class="muted">Clique sur la carte pour choisir l’endroit du signalement.</p>
      <div id="map"></div>
      <div class="map-tools">
        <button id="btn-center">Recentrer sur moi</button>
      </div>
    </section>

    <section class="card">
      <h2>Nouveau signalement</h2>
      <div class="form-grid">
        <div>
          <label for="camera-type">Type de caméra</label>
          <select id="camera-type">
            <option value="publique">Caméra publique</option>
            <option value="privee">Caméra privée</option>
            <option value="douteuse">Caméra douteuse</option>
          </select>
        </div>
        <div>
          <label for="camera-place">Lieu</label>
          <input id="camera-place" type="text" placeholder="Ex : devant la boulangerie">
        </div>
      </div>
      <label for="camera-description">Description</label>
      <textarea id="camera-description" placeholder="Décris la caméra, sa position, ce qu’elle filme…"></textarea>
      <div class="form-actions">
        <button id="btn-save-report">Enregistrer le signalement</button>
        <button id="btn-clear-form" class="secondary">Effacer</button>
      </div>
    </section>

    <section class="card">
      <h2>Signalements</h2>
      <p id="reports-counter" class="muted"></p>

      <div class="filters">
        <button class="filter active" data-filter="all">Tous</button>
        <button class="filter" data-filter="waiting">En attente</button>
        <button class="filter" data-filter="validated">Validés</button>
      </div>

      <div id="reports-list"></div>
    </section>
  </main>
</div>

<div id="status"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const db = window.supabase.createClient(
  "https://oxwpppuvghsaancjajoc.supabase.co",
  "sb_publishable_1eQSq-_gjzbEAkgaT9X8DA_USkUO2Vn"
);

const $ = id => document.getElementById(id);
const APP_URL =
  "https://yazdog84.github.io/Balance-Ta-Cam/BalanceTaCam/";

let map;
let selectedMarker;
let reportMarkers;
let currentUser = null;
let reports = [];
let refreshVersion = 0;
let statusTimer;

function showStatus(message) {
  $("status").textContent = message;
  $("status").classList.add("show");
  clearTimeout(statusTimer);
  statusTimer = setTimeout(
    () => $("status").classList.remove("show"),
    7000
  );
}

async function runButton(button, action) {
  button.disabled = true;
  try {
    await action();
  } catch (error) {
    showStatus(error.message || "Une erreur est survenue.");
  } finally {
    button.disabled = false;
  }
}

function initMap() {
  map = L.map("map").setView([48.8566, 2.3522], 13);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution:
      '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19
  }).addTo(map);

  reportMarkers = L.layerGroup().addTo(map);

  map.on("click", event => {
    if (selectedMarker) {
      selectedMarker.setLatLng(event.latlng);
    } else {
      selectedMarker = L.marker(event.latlng).addTo(map);
    }
    showStatus("Position sélectionnée.");
  });
}

function textElement(tag, text, className) {
  const element = document.createElement(tag);
  element.textContent = text;
  if (className) element.className = className;
  return element;
}

function displayReports() {
  $("reports-list").replaceChildren();
  reportMarkers.clearLayers();
  $("reports-counter").textContent =
    reports.length + " signalement(s) partagé(s)";

  reports.forEach(report => {
    const card = document.createElement("article");
    card.className = "report";

    card.append(
      textElement("span", "Non vérifié", "badge"),
      textElement("h3", report.place),
      textElement("p", report.description),
      textElement(
        "p",
        "Type : " + report.type +
        " • Par " + report.pseudo +
        " • " + new Date(report.created_at).toLocaleDateString("fr-FR"),
        "meta"
      )
    );

    const actions = document.createElement("div");
    actions.className = "report-actions";

    const locate = textElement("button", "Voir sur la carte");
    locate.onclick = () => {
      map.setView([report.lat, report.lng], 17);
      $("map").scrollIntoView({ behavior: "smooth" });
    };
    actions.append(locate);

    if (currentUser && report.user_id === currentUser.id) {
      const remove = textElement("button", "Supprimer mon signalement");

      remove.onclick = () => runButton(remove, async () => {
        if (!confirm("Supprimer définitivement ce signalement ?")) return;

        const { error } = await db
          .from("btc_reports")
          .delete()
          .eq("id", report.id)
          .eq("user_id", currentUser.id);

        if (error) throw error;
        await loadReports();
        showStatus("Signalement supprimé.");
      });

      actions.append(remove);
    }

    card.append(actions);
    $("reports-list").append(card);

    const popup = document.createElement("div");
    popup.append(
      textElement("strong", report.place),
      textElement("p", report.description)
    );

    L.marker([report.lat, report.lng])
      .addTo(reportMarkers)
      .bindPopup(popup);
  });
}

async function loadReports() {
  if (!currentUser) return;

  const version = ++refreshVersion;

  const { data, error } = await db
    .from("btc_reports")
    .select("id,user_id,pseudo,type,place,description,lat,lng,created_at")
    .order("created_at", { ascending: false })
    .limit(500);

  if (version !== refreshVersion || !currentUser) return;
  if (error) throw error;

  reports = data || [];
  displayReports();
}

function applySession(session) {
  currentUser = session ? session.user : null;
  $("auth").classList.toggle("hidden", !!currentUser);
  $("app").classList.toggle("hidden", !currentUser);

  if (!currentUser) {
    ++refreshVersion;
    reports = [];
    $("reports-list").replaceChildren();
    if (reportMarkers) reportMarkers.clearLayers();
    if (selectedMarker) {
      selectedMarker.remove();
      selectedMarker = null;
    }
    return;
  }

  setTimeout(() => {
    if (!currentUser) return;
    if (!map) initMap();
    map.invalidateSize();
    loadReports().catch(error => showStatus(error.message));
  }, 50);
}

$("show-register").onclick = () => {
  $("login-form").classList.add("hidden");
  $("register-form").classList.remove("hidden");
};

$("show-login").onclick = () => {
  $("register-form").classList.add("hidden");
  $("login-form").classList.remove("hidden");
};

$("btn-register").onclick = event =>
  runButton(event.currentTarget, async () => {
    const pseudo = $("register-pseudo").value.trim();
    const email = $("register-email").value.trim();
    const password = $("register-password").value;

    if (!pseudo || pseudo.length > 60) {
      throw new Error("Choisis un pseudo de 1 à 60 caractères.");
    }
    if (!$("register-email").checkValidity() || !email) {
      throw new Error("Entre une adresse email valide.");
    }
    if (password.length < 6) {
      throw new Error("Choisis un mot de passe d’au moins 6 caractères.");
    }

    const { data, error } = await db.auth.signUp({
      email,
      password,
      options: {
        data: { pseudo },
        emailRedirectTo: APP_URL
      }
    });

    if (error) throw error;

    $("register-password").value = "";

    if (data.session) {
      showStatus("Compte créé. Tu es connecté.");
    } else {
      $("show-login").click();
      showStatus(
        "Si l’inscription est acceptée, tu recevras un email. " +
        "Vérifie ta boîte et les indésirables, puis confirme ton adresse."
      );
    }
  });

$("btn-login").onclick = event =>
  runButton(event.currentTarget, async () => {
    const email = $("login-email").value.trim();
    const password = $("login-password").value;

    if (!email || !password) {
      throw new Error("Entre ton email et ton mot de passe.");
    }

    const { error } = await db.auth.signInWithPassword({
      email,
      password
    });

    if (error) throw error;
    $("login-password").value = "";
    showStatus("Connexion réussie.");
  });

$("btn-logout").onclick = event =>
  runButton(event.currentTarget, async () => {
    const { error } = await db.auth.signOut();
    if (error) throw error;
    showStatus("Déconnexion effectuée.");
  });

function centerOnMe() {
  if (!navigator.geolocation) {
    showStatus("Géolocalisation indisponible.");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    position => {
      if (!currentUser || !map) return;
      map.setView(
        [position.coords.latitude, position.coords.longitude],
        16
      );
      showStatus("Carte recentrée. Touche la carte pour choisir un point.");
    },
    () => showStatus(
      "Position inaccessible. Autorise la localisation ou choisis un point sur la carte."
    ),
    { timeout: 15000, maximumAge: 60000 }
  );
}

$("btn-center").onclick = centerOnMe;
$("btn-my-area").onclick = centerOnMe;

function clearForm() {
  $("camera-type").value = "publique";
  $("camera-place").value = "";
  $("camera-description").value = "";

  if (selectedMarker) {
    selectedMarker.remove();
    selectedMarker = null;
  }
}

$("btn-clear-form").onclick = clearForm;

$("camera-place").maxLength = 200;
$("camera-description").maxLength = 2000;

$("btn-save-report").onclick = event =>
  runButton(event.currentTarget, async () => {
    if (!currentUser) throw new Error("Connecte-toi d’abord.");
    if (!selectedMarker) {
      throw new Error("Choisis un point sur la carte.");
    }

    const place = $("camera-place").value.trim();
    const description = $("camera-description").value.trim();

    if (!place || !description) {
      throw new Error("Ajoute un lieu et une description.");
    }

    const position = selectedMarker.getLatLng();
    const pseudo = String(
      currentUser.user_metadata?.pseudo || "Membre"
    ).slice(0, 60);

    const { error } = await db.from("btc_reports").insert({
      user_id: currentUser.id,
      pseudo,
      type: $("camera-type").value,
      place,
      description,
      lat: position.lat,
      lng: position.lng
    });

    if (error) throw error;

    clearForm();
    await loadReports();
    showStatus("Signalement enregistré dans la base partagée.");
  });

const filters = document.querySelector(".filters");
if (filters) filters.classList.add("hidden");

const refreshButton = textElement("button", "Actualiser les signalements");
refreshButton.className = "secondary";
refreshButton.style.marginBottom = "12px";
refreshButton.onclick = () => runButton(refreshButton, loadReports);
$("reports-list").before(refreshButton);

db.auth.onAuthStateChange((_event, session) => {
  applySession(session);
});

db.auth.getSession().then(({ data, error }) => {
  if (error) {
    showStatus(error.message);
    return;
  }
  applySession(data.session);
});
</script>

</body>
</html>
